# Drift report: herdr's socket-API method inventory vs. the classification
# pall8t's relay applies to it (src/relay.rs). The relay's READ allowlist —
# what a sandboxed agent may call under `[herdr] sandbox = "readonly"` — is
# a hand-made snapshot, so a read method a newer herdr adds is silently
# classified Mutate and denied.
#
# REPORT-ONLY by design (issue #59), like the mutation and hygiene
# workflows: classification is a human decision, and the schema is not a
# complete inventory (see the script's caveat), so this can only ever
# suggest. No amount of drift fails this job, and a run without herdr
# installed is a skip rather than a failure.
#
# It does go red for one thing, which is not drift: the script being
# unable to check at all — schema output that is not JSON, a schema with
# no methods in it, or a `relay.rs` whose `READ` list it cannot parse.
# A drift report that silently checked nothing would read exactly like a
# clean one, which is the failure a weekly report can least afford.
name: herdr method drift

on:
  schedule:
    # Weekly, Saturday 04:00 JST (Friday 19:00 UTC) — an hour after the
    # hygiene report, so the two don't land on top of each other.
    - cron: '0 19 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the latest herdr release
        # The release binary, not the install script: nothing here needs a
        # herdr installation, only its bundled schema, and a named asset
        # download is easier to reason about than piping curl to sh.
        #
        # Deliberately unpinned and unverified, which is the one place
        # this repo accepts that: the question being asked is "what does
        # the *latest* herdr serve", so a pin would answer a different
        # one, and herdrdev/herdr publishes no checksums to verify
        # against. What bounds it is the blast radius — a scheduled job on
        # `main`, `contents: read`, no secrets in reach, and nothing built
        # here is ever consumed by a release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo herdrdev/herdr \
            --pattern 'herdr-linux-x86_64' --output ./herdr --clobber
          chmod +x ./herdr
          ./herdr --version

      - name: Report drift
        # Run twice on purpose, and the difference is the point. The first
        # is the report: its output goes to the run summary whatever
        # happens, `|| true` included, because a script that stopped early
        # still explains why there. The second decides the job's colour —
        # unguarded, so the "could not check at all" exits above turn this
        # red while every drift finding stays green. Piping the first into
        # the summary would have made tee's exit status the job's answer
        # (`bash -e` here has no pipefail), which is the trap quality.yml
        # documents.
        run: |
          {
            echo '## herdr method drift'
            echo '```'
            python3 scripts/herdr-method-drift.py --herdr ./herdr 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/herdr-method-drift.py --herdr ./herdr
